<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarCracker - Início</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: Arial, sans-serif; 
            color: #fff; 
            height: 100vh;
            display: flex;
            flex-direction: column;

            /* 🖼️ IMAGEM DE FUNDO */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('/img/fundo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden;
        }

        /* 👑 TÍTULO SUPERIOR CENTRAL */
        .header-titulo {
            text-align: center;
            padding: 15px 0;
        }

        .header-titulo h1 {
            font-size: 38px;
            color: #ffd700;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
            letter-spacing: 2px;
        }

        /* 📐 CONTAINER PRINCIPAL (3 COLUNAS) */
        .main-layout {
            display: grid;
            grid-template-columns: 240px 1fr 300px;
            gap: 20px;
            flex: 1;
            padding: 0 20px 20px 20px;
        }

        /* 👈 COLUNA ESQUERDA (BOTÕES) */
        .painel-esquerdo {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-acao {
            width: 100%;
            padding: 15px;
            border: 2px solid #ff9800;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-login {
            background: #ff9800;
            color: #121212;
        }

        .btn-login:hover {
            background: #e68a00;
            transform: scale(1.02);
        }

        .btn-cadastrar {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
            border-color: #ff9800;
        }

        .btn-cadastrar:hover {
            background: rgba(255, 152, 0, 0.4);
            transform: scale(1.02);
        }

        /* ⚪ COLUNA CENTRAL (CONTAINER EM BRANCO / INFORMAÇÕES) */
        .painel-central {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* 👉 COLUNA DIREITA (RANKING) */
        .painel-direito {
            background: rgba(18, 18, 18, 0.9);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            height: fit-content;
            max-height: 100%;
            overflow-y: auto;
        }

        .ranking-header-title {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .ranking-table th, .ranking-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .ranking-table th {
            color: #ffd700;
        }

        .posicao-top1 { color: #ffd700; font-weight: bold; }
        .posicao-top2 { color: #c0c0c0; font-weight: bold; }
        .posicao-top3 { color: #cd7f32; font-weight: bold; }

        /* 🔲 MODAIS (LOGIN E CADASTRO) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .card-modal { 
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(8px);
            padding: 25px; 
            border-radius: 8px; 
            width: 320px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8); 
            border: 1px solid #ff9800;
            position: relative;
        }

        .btn-fechar-modal {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
        
        .msg { margin-bottom: 15px; text-align: center; font-size: 14px; }
        .erro { color: #f44336; }
        .sucesso { color: #4caf50; }
    </style>
</head>
<body>

    <!-- 👑 NOME DARCRACKER CENTRALIZADO -->
    <header class="header-titulo">
        <h1>DarCracker</h1>
    </header>

    <!-- 📐 ESTRUTURA PRINCIPAL DA PÁGINA -->
    <main class="main-layout">

        <!-- 👈 BOTÕES DO LADO ESQUERDO -->
        <aside class="painel-esquerdo">
            <button class="btn-acao btn-login" onclick="abrirModal('modal-login')">Login</button>
            <button class="btn-acao btn-cadastrar" onclick="abrirModal('modal-cadastro')">Registrar / Cadastrar</button>
        </aside>

        <!-- ⚪ CONTAINER EM BRANCO NO CENTRO -->
        <section class="painel-central">
            <h2>Bem-vindo ao DarCracker!</h2>
            <p style="margin-top: 10px; color: #ccc;">Espaço reservado para avisos, novidades e informações do jogo.</p>
        </section>

        <!-- 👉 RANKING DO LADO DIREITO -->
        <aside class="painel-direito">
            <div class="ranking-header-title">
                🏆 Top 10 Jogadores
            </div>
            <div id="conteudo-ranking">
                <p style="color: #aaa;">Carregando ranking...</p>
            </div>
        </aside>

    </main>

    <!-- 🔲 MODAL DE LOGIN (OCULTO POR PADRÃO) -->
    <div id="modal-login" class="modal-overlay" style="display: none;">
        <div class="card-modal">
            <button class="btn-fechar-modal" onclick="fecharModal('modal-login')">✖</button>
            <h2 style="text-align: center; color: #ff9800; margin-bottom: 15px;">DarCracker - Login</h2>
            
            <div id="msg-login" class="msg"></div>
            
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" id="login-email">
            </div>
            <div class="form-group">
                <label>Senha:</label>
                <input type="password" id="login-senha">
            </div>
            
            <button class="btn-acao btn-login" onclick="fazerLogin()">Entrar</button>
        </div>
    </div>

    <!-- 🔲 MODAL DE CADASTRO (OCULTO POR PADRÃO) -->
    <div id="modal-cadastro" class="modal-overlay" style="display: none;">
        <div class="card-modal">
            <button class="btn-fechar-modal" onclick="fecharModal('modal-cadastro')">✖</button>
            <h2 style="text-align: center; color: #ff9800; margin-bottom: 15px;">Criar Herói</h2>
            
            <div id="msg-cadastro" class="msg"></div>
            
            <div class="form-group">
                <label>Nome do Herói:</label>
                <input type="text" id="cad-nome">
            </div>
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" id="cad-email">
            </div>
            <div class="form-group">
                <label>Senha:</label>
                <input type="password" id="cad-senha">
            </div>
            
            <button class="btn-acao btn-login" onclick="fazerCadastro()">Cadastrar</button>
        </div>
    </div>

    <script>
    const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:3000'
        : 'https://darcraker.onrender.com';

    // 🔄 Funções para abrir/fechar os Modais
    function abrirModal(idModal) {
        document.getElementById(idModal).style.display = 'flex';
    }

    function fecharModal(idModal) {
        document.getElementById(idModal).style.display = 'none';
    }

    // 🏆 Carregar o Ranking Lateral na inicialização
    async function carregarRanking() {
        const container = document.getElementById('conteudo-ranking');
        try {
            const res = await fetch(`${API_URL}/api/ranking`);
            const rankingData = await res.json();

            if (!rankingData || rankingData.length === 0) {
                container.innerHTML = '<p style="color:#aaa;">Nenhum jogador cadastrado.</p>';
                return;
            }

            let tabelaHTML = `
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>Pos.</th>
                            <th>Herói</th>
                            <th>Nível</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            rankingData.forEach((jogador, index) => {
                const pos = index + 1;
                let classePosicao = '';
                if (pos === 1) classePosicao = 'posicao-top1';
                else if (pos === 2) classePosicao = 'posicao-top2';
                else if (pos === 3) classePosicao = 'posicao-top3';

                tabelaHTML += `
                    <tr class="${classePosicao}">
                        <td>#${pos}</td>
                        <td>${jogador.nome_heroi}</td>
                        <td>Lv. ${jogador.nivel}</td>
                    </tr>
                `;
            });

            tabelaHTML += `</tbody></table>`;
            container.innerHTML = tabelaHTML;

        } catch (err) {
            container.innerHTML = '<p style="color:red;">Erro ao carregar ranking.</p>';
        }
    }

    // 🔑 Realizar Login do Herói
    async function fazerLogin() {
        const email = document.getElementById('login-email').value;
        const senha = document.getElementById('login-senha').value;
        const msg = document.getElementById('msg-login');

        const res = await fetch(`${API_URL}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
        });

        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('heroi', JSON.stringify(data.usuario));
            window.location.href = 'inicio.html';
        } else {
            msg.className = 'msg erro';
            msg.innerText = data.error || 'Erro ao fazer login';
        }
    }

    // 📝 Realizar Cadastro do Herói
    async function fazerCadastro() {
        const nome_heroi = document.getElementById('cad-nome').value;
        const email = document.getElementById('cad-email').value;
        const senha = document.getElementById('cad-senha').value;
        const msg = document.getElementById('msg-cadastro');

        const res = await fetch(`${API_URL}/api/cadastro`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome_heroi, email, senha })
        });

        const data = await res.json();
        if (res.ok) {
            msg.className = 'msg sucesso';
            msg.innerText = 'Herói cadastrado com sucesso!';
            setTimeout(() => {
                fecharModal('modal-cadastro');
                carregarRanking();
                abrirModal('modal-login'); // Já abre o login após cadastrar
            }, 1200);
        } else {
            msg.className = 'msg erro';
            msg.innerText = data.error || 'Erro ao cadastrar';
        }
    }

    // Executa ao carregar a página
    carregarRanking();
    </script>
</body>
</html>
