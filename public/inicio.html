<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarCraker - Início</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0d0d0d;
            color: #fff;
            height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ÁREA PRINCIPAL (Layout em 3 Colunas) */
        .main-container {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            gap: 10px;
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- 🔵 MENU SUPERIOR (AZUL) - Gerado pelo modulo_menu_superior.js -->
    <header id="header-menu"></header>

    <!-- ÁREA CENTRAL -->
    <main class="main-container">

        <!-- 🟡 PAINEL ESQUERDO (AMARELO + VERMELHO) - Gerado pelo modulo_menu_esquerdo.js -->
        <aside id="painel-esquerdo"></aside>

        <!-- ⚪ TELA DE COMBATE (BRANCO) - Gerada pelo modulo_tela_de_combate.js -->
        <section id="tela-combate"></section>

        <!-- 🟡 PAINEL DIREITO (AMARELO) - Gerado pelo modulo_menu_direito.js -->
        <aside id="painel-direito"></aside>

    </main>

    <!-- Importa o motor principal (inicio.js) -->
    <script type="module" src="./inicio.js"></script>
</body>
</html>
